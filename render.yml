name: build-assets
on:
  push:
    branches: [main]
    paths: ['src/remotion/current_script.tsx.enc']
  workflow_dispatch:
concurrency:
  group: build
  cancel-in-progress: false
permissions:
  contents: read

env:
  CHUNK_FRAMES: ${{ vars.CHUNK_FRAMES || '7200' }}   # frames per render job; lower it if a chunk nears the 6 h job limit
  RENDER_CONCURRENCY: ${{ vars.RENDER_CONCURRENCY || '2' }}

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      slug: ${{ steps.meta.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - name: 1 Decrypt script
        env:
          SCRIPT_KEY: ${{ secrets.SCRIPT_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -in src/remotion/current_script.tsx.enc -out src/remotion/current_script.tsx -pass env:SCRIPT_KEY
      - name: 2 Validate script
        run: node src/ci/extract.js
      - name: 2b Read slug
        id: meta
        run: echo "slug=$(node -p "require('./meta.json').slug")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/tts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-whisper-v1
      - name: 3 Install voice engine
        run: |
          sudo apt-get update -y
          sudo apt-get install -y espeak-ng ffmpeg libsndfile1
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r src/tts/requirements.txt
          python -m spacy download en_core_web_sm || true
      - name: 4 Generate voice and timings
        run: python src/tts/generate_voice.py
      - name: 5 Plan render chunks
        id: plan
        run: node src/ci/plan.js
      - uses: actions/upload-artifact@v4
        with:
          name: timings
          path: public/timings.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: narration
          path: public/narration.mp3
          retention-days: 1

  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix: ${{ fromJson(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt script
        env:
          SCRIPT_KEY: ${{ secrets.SCRIPT_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -in src/remotion/current_script.tsx.enc -out src/remotion/current_script.tsx -pass env:SCRIPT_KEY
      - uses: actions/download-artifact@v4
        with:
          name: timings
          path: public
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package.json') }}
      - name: Install
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -y
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2 libcups2t64
          npx remotion browser ensure
      - name: Render chunk ${{ matrix.i }} (frames ${{ matrix.a }}-${{ matrix.b }})
        run: |
          mkdir -p out
          npx remotion render src/remotion/index.ts Main out/chunk-${{ matrix.i }}.mp4 \
            --frames=${{ matrix.a }}-${{ matrix.b }} --muted --codec=h264 --crf=20 \
            --concurrency=${RENDER_CONCURRENCY} --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.i }}
          path: out/chunk-${{ matrix.i }}.mp4
          retention-days: 1

  finish:
    needs: [prep, render]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      DRIVE_DIR: ${{ vars.DRIVE_DIR || 'Videos' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: narration
          path: audio
      - name: Join chunks
        run: |
          sudo apt-get install -y ffmpeg >/dev/null
          for i in $(seq 0 $(( ${{ needs.prep.outputs.count }} - 1 ))); do echo "file 'chunks/chunk-$i.mp4'" >> list.txt; done
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy video.mp4
      - name: Add audio
        run: |
          ffmpeg -y -loglevel error -i video.mp4 -i audio/narration.mp3 -c:v copy -c:a aac -b:a 192k -shortest final.mp4
          ls -lh final.mp4
      - name: Upload to Google Drive
        if: env.RCLONE_CONF != ''
        run: |
          sudo apt-get install -y rclone >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          mv final.mp4 "${{ needs.prep.outputs.slug }}.mp4"
          rclone copy "${{ needs.prep.outputs.slug }}.mp4" "gdrive:${DRIVE_DIR}" --drive-chunk-size 128M
