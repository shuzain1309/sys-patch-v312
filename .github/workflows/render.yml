name: sync
on:
  push:
    paths: ['jobs/*.enc']   # delete-commits carry "[skip ci]" so they never trigger this

permissions:
  contents: read

env:
  PAYLOAD_KEY: ${{ secrets.PAYLOAD_KEY }}
  CHROME_LIBS: libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.tl.outputs.matrix }}
      dir: ${{ steps.tl.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q "edge-tts>=7.0" requests
      - name: unpack job
        run: |
          JOB=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'jobs/*.enc' | head -1)
          echo "JOB_ID=$(basename "$JOB" .enc)" >> "$GITHUB_ENV"
          mkdir -p public/job
          node src/crypt.mjs dec "$JOB" /tmp/p.tgz
          tar xzf /tmp/p.tgz -C public/job
      - run: python src/tts/generate_voice.py public/job
      - run: python src/assets/fetch_assets.py public/job
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      - id: tl
        run: python src/pipeline/build_timeline.py public/job
        env:
          CHUNK_FRAMES: ${{ vars.CHUNK_FRAMES || '4500' }}
      - run: python src/pipeline/mix_audio.py public/job
      - name: pack (encrypted, no per-scene audio)
        run: |
          tar czf /tmp/r.tgz --exclude=audio --exclude=tmp --exclude=tts.json -C public/job .
          node src/crypt.mjs enc /tmp/r.tgz ready.enc
      - uses: actions/upload-artifact@v4
        with: { name: ready, path: ready.enc, retention-days: 1 }

  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with: { path: ~/.npm, key: "npm-${{ hashFiles('package.json') }}" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq $CHROME_LIBS
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { name: ready }
      - name: render chunk
        run: |
          mkdir -p public/job out
          node src/crypt.mjs dec ready.enc /tmp/r.tgz && tar xzf /tmp/r.tgz -C public/job
          npx remotion render src/remotion/index.ts Video out/c.mp4 \
            --props=public/job/timeline.json --frames=${{ matrix.chunk.range }} \
            --muted --concurrency=2 --crf=20
          node src/crypt.mjs enc out/c.mp4 c.enc
      - uses: actions/upload-artifact@v4
        with: { name: "chunk-${{ matrix.chunk.i }}", path: c.enc, retention-days: 1 }

  finish:
    needs: [prep, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with: { path: ~/.npm, key: "npm-${{ hashFiles('package.json') }}" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq rclone $CHROME_LIBS
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: assemble video + thumbnails + meta
        run: |
          mkdir -p public/job out
          node src/crypt.mjs dec dl/ready/ready.enc /tmp/r.tgz && tar xzf /tmp/r.tgz -C public/job
          for d in dl/chunk-*; do node src/crypt.mjs dec "$d/c.enc" "out/$(basename "$d").mp4"; done
          for f in out/chunk-*.mp4; do echo "file '$PWD/$f'"; done > list.txt
          ffmpeg -v error -f concat -safe 0 -i list.txt -i public/job/audio.m4a \
            -map 0:v -map 1:a -c copy -movflags +faststart out/video.mp4
          N=$(jq '.thumbnail.variants // 3' public/job/timeline.json)
          for i in $(seq 0 $((N-1))); do
            jq ". + {variant:$i}" public/job/timeline.json > /tmp/t.json
            npx remotion still src/remotion/index.ts Thumb "out/thumb_$((i+1)).png" --props=/tmp/t.json
          done
          jq '{title:.meta.title, description:.meta.description, tags:.meta.tags, chapters:.chapters, thumbnail_text:.thumbnail.text}' \
            public/job/timeline.json > out/meta.json
      - name: upload to Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_DEST: ${{ secrets.RCLONE_DEST }}
          DIR: ${{ needs.prep.outputs.dir }}
        run: |
          mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone copy out "$RCLONE_DEST/$DIR" --include "video.mp4" --include "thumb_*.png" --include "meta.json"
