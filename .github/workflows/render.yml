name: build-assets
on:
  push:
    branches: [main]
    paths: ['src/remotion/current_script.tsx.enc']
  workflow_dispatch:
concurrency:
  group: build
  cancel-in-progress: false
permissions:
  contents: read

env:
  MAX_PARALLEL: ${{ vars.MAX_PARALLEL || '20' }}
  RENDER_FPS_EST: ${{ vars.RENDER_FPS_EST || '3' }}

jobs:
  # 1. validate + QA the script (seconds)
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      slug: ${{ steps.meta.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - name: 1 Decrypt script
        env:
          SCRIPT_KEY: ${{ secrets.SCRIPT_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -in src/remotion/current_script.tsx.enc -out src/remotion/current_script.tsx -pass env:SCRIPT_KEY
      - name: 2 Validate script and QA
        run: node src/ci/extract.js
      - name: 2b Read slug
        id: meta
        run: echo "slug=$(node -p "require('./meta.json').slug")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: scriptmeta
          path: |
            narration.json
            chapters.json
            seo.json
            meta.json
          retention-days: 1

  # 2. speech is synthesised in 6 parallel shards (every 6th scene each)
  voice:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: scriptmeta, path: .}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/tts/*.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-whisper-v1
      - name: 3 Install voice engine
        run: |
          sudo apt-get update -y
          sudo apt-get install -y espeak-ng ffmpeg libsndfile1
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r src/tts/requirements.txt -c src/tts/constraints.txt
          python -m spacy download en_core_web_sm
          python -c "import spacy; spacy.load('en_core_web_sm'); print('spacy ok', spacy.__version__)"
      - name: 4 Speak shard ${{ matrix.shard }} of 6
        run: python src/tts/generate_voice.py shard ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.shard }}
          path: clips
          retention-days: 1
          if-no-files-found: ignore

  # 3. stitch speech, captions, chapters, SEO, sound effects, render plan
  merge:
    needs: [check, voice]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: scriptmeta, path: .}
      - uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          path: clips
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 5 Install audio tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libsndfile1
          pip install numpy soundfile
      - name: 6 Merge speech, make captions and SEO
        run: python src/tts/generate_voice.py merge
      - name: 6b Synthesise sound effects
        run: python src/tts/sfx.py
      - name: 7 Plan render chunks
        id: plan
        run: node src/ci/plan.js
      - uses: actions/upload-artifact@v4
        with: {name: timings, path: public/timings.json, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: narration, path: public/narration.mp3, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: sfx, path: public/sfx, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with: {name: meta, path: out, retention-days: 1}

  # 4. one job per frame range: picture AND sound for that range
  render:
    needs: [check, merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix: ${{ fromJson(needs.merge.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt script
        env:
          SCRIPT_KEY: ${{ secrets.SCRIPT_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -in src/remotion/current_script.tsx.enc -out src/remotion/current_script.tsx -pass env:SCRIPT_KEY
      - uses: actions/download-artifact@v4
        with: {name: timings, path: public}
      - uses: actions/download-artifact@v4
        with: {name: narration, path: public}
      - uses: actions/download-artifact@v4
        with: {name: sfx, path: public/sfx}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ hashFiles('package.json') }}-${{ vars.DEPS_VERSION || '1' }}
      - name: Install (cached after the first run)
        run: |
          [ -d node_modules/remotion ] || npm install --no-audit --no-fund
          sudo apt-get update -y
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2 libcups2t64
          npx remotion browser ensure
          echo "cores: $(nproc)"; npx remotion versions 2>/dev/null | head -3 || true
      - name: Render picture, frames ${{ matrix.a }}-${{ matrix.b }}
        run: |
          mkdir -p out
          npx remotion render src/remotion/index.ts Main out/chunk-${{ matrix.i }}.mp4 \
            --frames=${{ matrix.a }}-${{ matrix.b }} --muted --codec=h264 --crf=21 --x264-preset=veryfast \
            --jpeg-quality=80 --concurrency=$(nproc) --log=warn
      - name: Render sound for the same frames (narration + effects + music)
        continue-on-error: true
        run: |
          npx remotion render src/remotion/index.ts Main out/audio-${{ matrix.i }}.wav --codec=wav \
            --frames=${{ matrix.a }}-${{ matrix.b }} --props='{"audio":true}' --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.i }}
          path: out/chunk-${{ matrix.i }}.mp4
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.i }}
          path: out/audio-${{ matrix.i }}.wav
          retention-days: 1
          if-no-files-found: ignore

  # 5. join, mux, publish (light work only)
  finish:
    needs: [check, merge, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      DRIVE_DIR: ${{ vars.DRIVE_DIR || 'Videos' }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: narration, path: audio}
      - uses: actions/download-artifact@v4
        with: {name: meta, path: out}
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: audio-*
          path: wavs
          merge-multiple: true
      - name: Join picture chunks
        run: |
          sudo apt-get install -y ffmpeg >/dev/null
          N=${{ needs.merge.outputs.count }}
          for i in $(seq 0 $((N - 1))); do echo "file 'chunks/chunk-$i.mp4'" >> vlist.txt; done
          ffmpeg -y -loglevel error -f concat -safe 0 -i vlist.txt -c copy video.mp4
          OK=1; for i in $(seq 0 $((N - 1))); do [ -f wavs/audio-$i.wav ] || OK=0; done
          if [ $OK = 1 ]; then
            for i in $(seq 0 $((N - 1))); do echo "file 'wavs/audio-$i.wav'" >> alist.txt; done
            ffmpeg -y -loglevel error -f concat -safe 0 -i alist.txt -c:a aac -b:a 192k mix.m4a
            echo "sound: full mix (narration + effects)"
          else
            echo "::warning::per-chunk sound render missing; using narration only"
            ffmpeg -y -loglevel error -i audio/narration.mp3 -c:a aac -b:a 192k mix.m4a
          fi
      - name: Add sound
        run: |
          ffmpeg -y -loglevel error -i video.mp4 -i mix.m4a -c:v copy -c:a copy -shortest final.mp4
          ls -lh final.mp4
      - name: Upload to Google Drive
        if: env.RCLONE_CONF != ''
        run: |
          sudo apt-get install -y rclone >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          D="gdrive:${DRIVE_DIR}/${{ needs.check.outputs.slug }}"
          rclone copyto final.mp4 "$D/${{ needs.check.outputs.slug }}.mp4" --drive-chunk-size 128M
          rclone copy out "$D" --include "captions.*" --include "seo.json" --include "description.txt" --include "chapters.txt"
      - name: Upload to YouTube (video + captions + metadata)
        if: env.YT_REFRESH_TOKEN != ''
        run: |
          pip install --quiet google-api-python-client google-auth
          python src/ci/youtube_upload.py final.mp4 out/seo.json out/captions.srt
