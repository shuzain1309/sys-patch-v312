name: assets
on:
  workflow_dispatch:
    inputs:
      manifest: {description: manifest path, default: test_manifest.json}
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pillow kaggle "rembg[cpu]"
      - run: python src/assets/gen_assets.py "${{ inputs.manifest }}"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_1 }}
          CF_API_TOKEN: ${{ secrets.CF_SECRET_1 }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USER_1 }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY_1 }}
      - if: always()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add public library.json && git commit -m sync && git push || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: preview, path: "public/\nlibrary.json"}
