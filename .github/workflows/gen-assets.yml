name: assets
on:
  workflow_dispatch:
    inputs:
      manifest: {description: manifest path, default: test_manifest.json}
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pillow "rembg[cpu]"
      - run: python src/assets/gen_assets.py "${{ inputs.manifest }}"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      - uses: actions/upload-artifact@v4
        with: {name: preview, path: "public/\nlibrary.json"}
