# Standalone thumbnails from the dashboard: no script, no voice, no video render. Takes about 3 minutes.
# The dashboard commits thumb/job.enc (AES, SCRIPT_KEY). Results are encrypted again and force-pushed to the branch `thumb-results`
# (one commit, replaced every time, so main never grows). The dashboard decrypts and shows them.
name: thumbnail
on:
  push:
    branches: [main]
    paths: ['thumb/job.enc']
  workflow_dispatch:
concurrency:
  group: thumbnail
  cancel-in-progress: false
permissions:
  contents: write
env:
  SCRIPT_KEY: ${{ secrets.SCRIPT_KEY }}
jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt job
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -in thumb/job.enc -out job.json -pass env:SCRIPT_KEY
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ hashFiles('package.json') }}-${{ vars.DEPS_VERSION || '1' }}
      - name: Install
        run: |
          [ -d node_modules/remotion ] || npm install --no-audit --no-fund
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2 libcups2t64
          npx remotion browser ensure
          pip install --quiet rembg onnxruntime pillow numpy scipy || echo "::warning::rembg not installed, portraits keep their background"
      - name: Make thumbnails
        run: node src/ci/thumb.js job.json out/thumbs
      - name: Publish result (encrypted) to branch thumb-results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f out/thumbs/meta.json ] || { echo "nothing was produced"; exit 0; }
          mkdir res
          for f in out/thumbs/*; do openssl enc -aes-256-cbc -pbkdf2 -iter 10000 -md sha256 -salt -in "$f" -out "res/$(basename "$f").enc" -pass env:SCRIPT_KEY; done
          cd res && git init -q -b thumb-results && git add . \
            && git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -qm "result" \
            && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" thumb-results
      - name: Copy to Google Drive (only if ticked in the dashboard)
        if: always()
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          DRIVE_DIR: ${{ vars.DRIVE_DIR || 'Videos' }}
        run: |
          [ "$(node -p "require('./job.json').drive ? 1 : 0")" = 1 ] && [ -n "$RCLONE_CONF" ] && [ -d out/thumbs ] || exit 0
          sudo apt-get install -y rclone >/dev/null
          mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone copy out/thumbs "gdrive:${DRIVE_DIR}/thumbnails/$(node -p "require('./job.json').id")" --include "thumb-?.jpg"
