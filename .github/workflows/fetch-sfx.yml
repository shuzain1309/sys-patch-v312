name: fetch-sfx
on: workflow_dispatch          # run once from the Actions tab; run again after adding a source to sfx-real-name.json
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 src/tts/sfx_real.py fetch
      - run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add sfx-real sfx-real-index.txt
          git commit -m "sfx library" || echo "nothing new"
          git push
