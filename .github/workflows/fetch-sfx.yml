name: fetch-sfx
on:
  workflow_dispatch:
    inputs:
      mode: {description: "fetch = download missing keys, candidates = list matches to audition and pin by id", default: fetch}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 src/tts/audio_real.py ${{ inputs.mode || 'fetch' }} sfx
        env:
          FREESOUND_KEY: ${{ secrets.FREESOUND_KEY }}
      - if: ${{ (inputs.mode || 'fetch') == 'fetch' }}
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add sfx-real sfx-real-credits.json
          git commit -m "sync" || echo "nothing new"
          git pull --rebase -q || true
          git push
