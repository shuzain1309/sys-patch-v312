name: fetch-photos
on:
  workflow_dispatch:
    inputs:
      catalog: {description: "json photo list to download into photo-cache/", default: library/photos-russia.json}
      force: {description: "force = download again even if already cached", default: ""}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - run: python3 src/ci/photos.py fetch "${{ inputs.catalog || 'library/photos-russia.json' }}" ${{ inputs.force }}
      - name: Commit the cache (jpg + credit json per photo)
        run: |
          git config user.name github-actions
          git config user.email actions@users.noreply.github.com
          git add photo-cache
          git commit -m "sync" || echo "nothing new"
          git pull --rebase -q || true
          git push
